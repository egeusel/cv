<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ege Usel - software engineer, full-stack developer, and data engineer.">
    <title>Ege Usel | Executive Resume</title>
    <style>
        :root {
            --navy: #082a3e;
            --navy-light: #123f56;
            --blue: #0b72b9;
            --cyan: #52d3c5;
            --ink: #17313f;
            --muted: #647782;
            --line: #dce5e9;
            --wash: #f3f7f8;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--white);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 16px;
            line-height: 1.65;
        }

        a {
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        :focus-visible {
            outline: 3px solid var(--cyan);
            outline-offset: 3px;
        }

        .shell {
            width: min(1140px, calc(100% - 48px));
            margin-inline: auto;
        }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 20;
            padding: 10px 14px;
            background: var(--cyan);
            color: var(--navy);
            transform: translateY(-160%);
        }

        .skip-link:focus {
            transform: none;
        }

        .site-header {
            overflow: hidden;
            background:
                radial-gradient(circle at 88% 14%, rgba(82, 211, 197, 0.16), transparent 24%),
                var(--navy);
            color: var(--white);
        }

        .topbar {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        }

        .monogram {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: var(--cyan);
            color: var(--navy);
            font-weight: 900;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            font-size: 0.84rem;
            font-weight: 650;
        }

        .nav-links a,
        .resume-link {
            text-decoration: none;
        }

        .nav-links a:hover,
        .resume-link:hover {
            color: var(--cyan);
        }

        .resume-link {
            padding: 9px 14px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 7px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 80px;
            align-items: center;
            padding-block: 76px;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--cyan);
            font-size: 0.73rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(3.4rem, 7vw, 6.5rem);
            letter-spacing: -0.065em;
            line-height: 0.98;
        }

        .hero-role {
            max-width: 690px;
            margin: 22px 0 14px;
            color: var(--white);
            font-size: clamp(1.25rem, 2.3vw, 1.7rem);
            font-weight: 500;
            line-height: 1.35;
        }

        .hero-bio {
            max-width: 720px;
            margin: 0;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.94rem;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 9px 19px;
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 7px;
            font-size: 0.83rem;
            font-weight: 750;
            text-decoration: none;
        }

        .button-primary {
            background: var(--cyan);
            border-color: var(--cyan);
            color: var(--navy);
        }

        .button-primary:hover {
            background: var(--white);
            border-color: var(--white);
        }

        .button-secondary:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .quick-facts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            margin: 36px 0 0;
            background: rgba(255, 255, 255, 0.16);
        }

        .quick-facts div {
            padding: 14px 16px;
            background: var(--navy);
        }

        .quick-facts dt {
            color: var(--cyan);
            font-size: 0.64rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .quick-facts dd {
            margin: 3px 0 0;
            font-size: 0.86rem;
            font-weight: 650;
        }

        .portrait {
            position: relative;
            margin: 0;
        }

        .portrait::before {
            content: "";
            position: absolute;
            inset: -18px 18px 18px -18px;
            border: 1px solid rgba(82, 211, 197, 0.5);
            border-radius: 18px;
        }

        .portrait-frame {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            background: var(--navy-light);
        }

        .portrait img {
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
        }

        .portrait figcaption {
            position: relative;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding-top: 18px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.72rem;
        }

        .portrait figcaption strong {
            color: var(--white);
        }

        .concept-note {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.65rem;
            font-weight: 750;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .concept-switcher {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .concept-switcher > span {
            margin-right: 5px;
        }

        .concept-switcher a {
            width: 27px;
            height: 27px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 5px;
            color: var(--white);
            text-decoration: none;
        }

        .concept-switcher a[aria-current="page"] {
            background: var(--cyan);
            border-color: var(--cyan);
            color: var(--navy);
        }

        .section {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 64px;
            padding-block: 92px;
            border-bottom: 1px solid var(--line);
        }

        .section > :not(.section-heading) {
            grid-column: 2;
        }

        .section-heading {
            grid-row: 1 / span 3;
            align-self: start;
            position: sticky;
            top: 24px;
        }

        .section-number {
            display: block;
            margin-bottom: 12px;
            color: var(--blue);
            font-size: 0.7rem;
            font-weight: 850;
            letter-spacing: 0.14em;
        }

        .section-heading h2 {
            margin: 0;
            font-size: clamp(2rem, 3.5vw, 3rem);
            letter-spacing: -0.045em;
            line-height: 1;
        }

        .section-heading p {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .skill-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .skill-group {
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--wash);
        }

        .skill-group h3 {
            margin: 0 0 15px;
            color: var(--navy);
            font-size: 0.95rem;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-list span,
        .project-tags span {
            padding: 4px 9px;
            border-radius: 999px;
            background: var(--white);
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.68rem;
        }

        .timeline {
            border-top: 2px solid var(--navy);
        }

        .role {
            display: grid;
            grid-template-columns: 34px 170px minmax(0, 1fr);
            gap: 20px;
            padding: 34px 0;
            border-bottom: 1px solid var(--line);
        }

        .role-index,
        .project-index,
        .credential-index {
            color: var(--blue);
            font-size: 0.67rem;
            font-weight: 850;
            letter-spacing: 0.1em;
        }

        .role-meta p {
            margin: 0;
        }

        .role-company {
            color: var(--navy);
            font-size: 0.95rem;
            font-weight: 800;
        }

        .role-date {
            margin-top: 4px !important;
            color: var(--muted);
            font-size: 0.69rem;
            font-weight: 650;
            text-transform: uppercase;
        }

        .role-content h3 {
            margin: 0 0 16px;
            color: var(--navy);
            font-size: 1.35rem;
            line-height: 1.25;
        }

        .bullet-list {
            margin: 0;
            padding-left: 1.1rem;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .bullet-list li {
            margin-bottom: 10px;
            padding-left: 6px;
        }

        .bullet-list li::marker {
            color: var(--blue);
        }

        .bullet-list strong {
            color: var(--ink);
            font-weight: 750;
        }

        .project-grid {
            border-top: 2px solid var(--navy);
        }

        .project {
            border-bottom: 1px solid var(--line);
        }

        .project summary {
            min-height: 94px;
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr) 30px;
            gap: 14px;
            align-items: center;
            padding: 18px 12px;
            cursor: pointer;
            list-style: none;
        }

        .project summary::-webkit-details-marker {
            display: none;
        }

        .project summary:hover {
            background: var(--wash);
        }

        .project-name {
            display: block;
            color: var(--navy);
            font-size: 1.06rem;
            font-weight: 800;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 7px;
        }

        .expand-icon {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 50%;
        }

        .expand-icon::before {
            content: "+";
        }

        .project[open] .expand-icon::before {
            content: "\2212";
        }

        .project-body {
            padding: 4px 50px 26px 66px;
        }

        .education-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .education-card {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .education-image {
            height: 130px;
            overflow: hidden;
            background: var(--wash);
        }

        .education-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .education-content {
            padding: 24px;
        }

        .education-content h3 {
            margin: 0 0 18px;
            color: var(--navy);
            font-size: 1.35rem;
        }

        .course-list,
        .additional-grid ul {
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 0.75rem;
        }

        .course-list li {
            display: grid;
            grid-template-columns: minmax(86px, 0.35fr) 1fr;
            gap: 10px;
            padding: 8px 0;
            border-top: 1px solid var(--line);
        }

        .course-list span,
        .additional-grid li {
            color: var(--muted);
        }

        .additional-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 16px;
        }

        .additional-grid article {
            padding: 20px;
            border-radius: 10px;
            background: var(--wash);
        }

        .additional-grid h3 {
            margin: 0 0 12px;
            color: var(--navy);
            font-size: 0.92rem;
        }

        .additional-grid li {
            margin-bottom: 6px;
        }

        .credential-grid {
            display: grid;
            gap: 10px;
        }

        .credential-card {
            display: grid;
            grid-template-columns: 36px minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 10px;
            text-decoration: none;
        }

        .credential-card:hover {
            border-color: var(--blue);
            box-shadow: 0 8px 30px rgba(8, 42, 62, 0.08);
        }

        .credential-card strong,
        .credential-card small {
            display: block;
        }

        .credential-card strong {
            color: var(--navy);
        }

        .credential-card small {
            margin-top: 2px;
            color: var(--muted);
        }

        .contact-section {
            padding-block: 100px;
            background: var(--wash);
            text-align: center;
        }

        .contact-inner h2 {
            max-width: 720px;
            margin: 0 auto 20px;
            color: var(--navy);
            font-size: clamp(2.8rem, 6vw, 5.3rem);
            letter-spacing: -0.06em;
            line-height: 1;
        }

        .contact-inner > a {
            color: var(--blue);
            font-size: clamp(1rem, 2.5vw, 1.45rem);
            font-weight: 750;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 30px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .site-footer {
            padding-block: 24px;
            background: var(--navy);
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.72rem;
        }

        .site-footer .shell {
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 880px) {
            .hero {
                grid-template-columns: minmax(0, 1fr) 220px;
                gap: 40px;
            }

            .section {
                grid-template-columns: 1fr;
                gap: 36px;
            }

            .section > :not(.section-heading) {
                grid-column: 1;
            }

            .section-heading {
                position: static;
                grid-row: auto;
            }
        }

        @media (max-width: 680px) {
            .shell {
                width: min(100% - 28px, 1140px);
            }

            .nav-links {
                display: none;
            }

            .hero {
                grid-template-columns: 1fr;
                padding-block: 52px;
            }

            .portrait {
                width: min(100%, 320px);
            }

            .quick-facts,
            .skill-grid,
            .education-grid,
            .additional-grid {
                grid-template-columns: 1fr;
            }

            .concept-note {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
                padding-block: 14px;
            }

            .section {
                padding-block: 68px;
            }

            .role {
                grid-template-columns: 30px minmax(0, 1fr);
                gap: 12px;
            }

            .role-meta,
            .role-content {
                grid-column: 2;
            }

            .project-body {
                padding-left: 52px;
            }

            .course-list li {
                grid-template-columns: 1fr;
                gap: 1px;
            }
        }

        @media print {
            .topbar,
            .concept-note,
            .hero-actions,
            .contact-section,
            .site-footer {
                display: none;
            }

            .site-header {
                background: var(--white);
                color: var(--ink);
            }

            .hero {
                padding-block: 20px;
            }

            .hero-bio {
                color: var(--muted);
            }

            .section {
                padding-block: 28px;
            }
        }
    </style>
</head>
<body data-concept="3" data-concept-name="Executive">
    <div id="app"></div>
    <script src="resume-data.js"></script>
</body>
</html>
