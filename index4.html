<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ege Usel - software engineer, full-stack developer, and data engineer.">
    <title>Ege Usel | Technical Portfolio</title>
    <style>
        :root {
            --bg: #090c10;
            --panel: #10151b;
            --panel-2: #151c24;
            --ink: #e7edf3;
            --muted: #91a0ae;
            --green: #a6ff66;
            --blue: #66c7ff;
            --purple: #b899ff;
            --line: #27323d;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                var(--bg);
            background-size: 32px 32px;
            color: var(--ink);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 15px;
            line-height: 1.7;
        }

        a {
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        :focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 4px;
        }

        ::selection {
            background: var(--green);
            color: var(--bg);
        }

        .shell {
            width: min(1200px, calc(100% - 48px));
            margin-inline: auto;
        }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 30;
            padding: 8px 12px;
            background: var(--green);
            color: var(--bg);
            transform: translateY(-160%);
        }

        .skip-link:focus {
            transform: none;
        }

        .site-header {
            min-height: 100vh;
            background:
                radial-gradient(circle at 84% 20%, rgba(102, 199, 255, 0.1), transparent 25%),
                radial-gradient(circle at 18% 80%, rgba(166, 255, 102, 0.07), transparent 25%);
            border-bottom: 1px solid var(--line);
        }

        .topbar {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            font-size: 0.74rem;
        }

        .monogram {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--green);
            font-weight: 800;
            text-decoration: none;
        }

        .monogram::before {
            content: ">_";
            color: var(--blue);
        }

        .nav-links {
            display: flex;
            gap: 26px;
        }

        .nav-links a,
        .resume-link {
            color: var(--muted);
            text-decoration: none;
        }

        .nav-links a::before {
            content: "./";
            color: var(--green);
        }

        .nav-links a:hover,
        .resume-link:hover {
            color: var(--green);
        }

        .resume-link {
            padding: 8px 12px;
            border: 1px solid var(--line);
        }

        .hero {
            min-height: calc(100vh - 130px);
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(260px, 0.65fr);
            gap: clamp(45px, 8vw, 110px);
            align-items: center;
            padding-block: 64px;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--green);
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "$ whoami / ";
            color: var(--muted);
        }

        .hero h1 {
            max-width: 800px;
            margin: 0;
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(4rem, 8vw, 8rem);
            letter-spacing: -0.075em;
            line-height: 0.88;
        }

        .hero h1::after {
            content: "_";
            color: var(--green);
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .hero h1::after {
                animation: none;
            }
        }

        .hero-role {
            max-width: 720px;
            margin: 32px 0 14px;
            color: var(--blue);
            font-size: clamp(1.15rem, 2vw, 1.5rem);
            line-height: 1.45;
        }

        .hero-bio {
            max-width: 750px;
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 8px 16px;
            border: 1px solid var(--line);
            font-size: 0.78rem;
            font-weight: 800;
            text-decoration: none;
        }

        .button-primary {
            background: var(--green);
            border-color: var(--green);
            color: var(--bg);
        }

        .button-primary:hover {
            background: var(--blue);
            border-color: var(--blue);
        }

        .button-secondary {
            color: var(--blue);
        }

        .button-secondary:hover {
            border-color: var(--blue);
        }

        .quick-facts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 34px 0 0;
        }

        .quick-facts div {
            padding: 13px;
            border: 1px solid var(--line);
            background: rgba(16, 21, 27, 0.74);
        }

        .quick-facts dt {
            color: var(--purple);
            font-size: 0.63rem;
            text-transform: uppercase;
        }

        .quick-facts dd {
            margin: 3px 0 0;
            color: var(--ink);
            font-size: 0.76rem;
        }

        .portrait {
            margin: 0;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 12px 12px 0 rgba(166, 255, 102, 0.12);
        }

        .portrait::before {
            content: "profile.png";
            display: block;
            padding: 9px 13px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.67rem;
        }

        .portrait-frame {
            padding: 12px;
        }

        .portrait img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            filter: grayscale(1) contrast(1.08);
        }

        .portrait figcaption {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 13px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.66rem;
        }

        .portrait figcaption strong {
            color: var(--green);
        }

        .concept-note {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.66rem;
            text-transform: uppercase;
        }

        .concept-note > span::before {
            content: "// ";
            color: var(--green);
        }

        .concept-switcher {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .concept-switcher a {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            color: var(--muted);
            text-decoration: none;
        }

        .concept-switcher a[aria-current="page"] {
            background: var(--green);
            border-color: var(--green);
            color: var(--bg);
        }

        .section {
            padding-block: 100px;
            border-bottom: 1px solid var(--line);
        }

        .section-heading {
            display: grid;
            grid-template-columns: 58px minmax(0, 1fr);
            gap: 24px;
            margin-bottom: 50px;
        }

        .section-number {
            padding-top: 10px;
            color: var(--green);
            font-size: 0.7rem;
        }

        .section-heading h2 {
            margin: 0;
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(2.8rem, 5.5vw, 5.2rem);
            letter-spacing: -0.06em;
            line-height: 1;
        }

        .section-heading h2::before {
            content: "./";
            color: var(--green);
        }

        .section-heading p {
            max-width: 650px;
            margin: 15px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .skill-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-left: 82px;
        }

        .skill-group {
            padding: 24px;
            border: 1px solid var(--line);
            background: rgba(16, 21, 27, 0.82);
        }

        .skill-group h3 {
            margin: 0 0 16px;
            color: var(--blue);
            font-size: 0.86rem;
        }

        .skill-group h3::before {
            content: "const ";
            color: var(--purple);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-list span,
        .project-tags span {
            padding: 4px 8px;
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--muted);
            font-size: 0.65rem;
        }

        .timeline {
            position: relative;
            margin-left: 82px;
            border-left: 1px solid var(--line);
        }

        .role {
            position: relative;
            display: grid;
            grid-template-columns: 38px 190px minmax(0, 1fr);
            gap: 20px;
            padding: 38px 0 38px 28px;
            border-bottom: 1px solid var(--line);
        }

        .role::before {
            content: "";
            position: absolute;
            top: 47px;
            left: -5px;
            width: 9px;
            height: 9px;
            background: var(--green);
            box-shadow: 0 0 0 5px var(--bg);
        }

        .role-index,
        .project-index,
        .credential-index {
            color: var(--purple);
            font-size: 0.66rem;
        }

        .role-meta p {
            margin: 0;
        }

        .role-company {
            color: var(--green);
            font-size: 0.86rem;
            font-weight: 800;
        }

        .role-date {
            margin-top: 5px !important;
            color: var(--muted);
            font-size: 0.65rem;
        }

        .role-content h3 {
            margin: 0 0 17px;
            color: var(--ink);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.4rem;
            line-height: 1.25;
        }

        .bullet-list {
            margin: 0;
            padding-left: 1.1rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .bullet-list li {
            margin-bottom: 11px;
            padding-left: 6px;
        }

        .bullet-list li::marker {
            color: var(--green);
        }

        .bullet-list strong {
            color: var(--blue);
        }

        code {
            color: var(--green);
            font-family: inherit;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-left: 82px;
        }

        .project {
            align-self: start;
            border: 1px solid var(--line);
            background: rgba(16, 21, 27, 0.86);
        }

        .project[open] {
            border-color: rgba(166, 255, 102, 0.55);
        }

        .project summary {
            display: grid;
            grid-template-columns: 32px minmax(0, 1fr) 24px;
            gap: 12px;
            min-height: 128px;
            padding: 20px;
            cursor: pointer;
            list-style: none;
        }

        .project summary::-webkit-details-marker {
            display: none;
        }

        .project-name {
            display: block;
            color: var(--ink);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.1rem;
            font-weight: 750;
            line-height: 1.25;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 14px;
        }

        .expand-icon::before {
            content: "[+]";
            color: var(--green);
            font-size: 0.68rem;
        }

        .project[open] .expand-icon::before {
            content: "[-]";
        }

        .project-body {
            padding: 0 20px 22px 64px;
            border-top: 1px dashed var(--line);
        }

        .project-body .bullet-list {
            padding-top: 20px;
        }

        .education-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-left: 82px;
        }

        .education-card {
            border: 1px solid var(--line);
            background: var(--panel);
        }

        .education-image {
            height: 120px;
            overflow: hidden;
            border-bottom: 1px solid var(--line);
        }

        .education-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.15) brightness(0.7);
        }

        .education-content {
            padding: 24px;
        }

        .education-content h3 {
            margin: 0 0 20px;
            color: var(--green);
            font-size: 1.05rem;
        }

        .course-list,
        .additional-grid ul {
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 0.7rem;
        }

        .course-list li {
            display: grid;
            grid-template-columns: minmax(90px, 0.35fr) 1fr;
            gap: 12px;
            padding: 8px 0;
            border-top: 1px solid var(--line);
        }

        .course-list strong {
            color: var(--blue);
        }

        .course-list span,
        .additional-grid li {
            color: var(--muted);
        }

        .additional-grid {
            display: grid;
            grid-template-columns: 0.8fr 1.4fr 0.8fr;
            gap: 12px;
            margin: 12px 0 0 82px;
        }

        .additional-grid article {
            padding: 20px;
            border: 1px solid var(--line);
            background: var(--panel);
        }

        .additional-grid h3 {
            margin: 0 0 12px;
            color: var(--purple);
            font-size: 0.8rem;
        }

        .additional-grid li {
            margin-bottom: 6px;
        }

        .credential-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-left: 82px;
        }

        .credential-card {
            display: grid;
            grid-template-columns: 26px minmax(0, 1fr) auto;
            gap: 12px;
            min-height: 130px;
            padding: 20px;
            border: 1px solid var(--line);
            background: var(--panel);
            text-decoration: none;
        }

        .credential-card:hover {
            border-color: var(--green);
        }

        .credential-card strong,
        .credential-card small {
            display: block;
        }

        .credential-card strong {
            color: var(--blue);
            font-size: 0.84rem;
        }

        .credential-card small {
            margin-top: 7px;
            color: var(--muted);
            font-size: 0.66rem;
        }

        .contact-section {
            padding-block: 110px;
            background:
                linear-gradient(135deg, rgba(166, 255, 102, 0.08), transparent 45%),
                var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .contact-inner h2 {
            max-width: 850px;
            margin: 0 0 25px;
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(3rem, 7vw, 6.5rem);
            letter-spacing: -0.07em;
            line-height: 0.95;
        }

        .contact-inner > a {
            color: var(--green);
            font-size: clamp(1rem, 2.6vw, 1.5rem);
            text-underline-offset: 6px;
        }

        .contact-links {
            display: flex;
            gap: 24px;
            margin-top: 34px;
            color: var(--blue);
            font-size: 0.73rem;
        }

        .site-footer {
            padding-block: 24px;
            color: var(--muted);
            font-size: 0.67rem;
        }

        .site-footer .shell {
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .portrait {
                width: min(100%, 390px);
            }

            .skill-grid,
            .timeline,
            .project-grid,
            .education-grid,
            .additional-grid,
            .credential-grid {
                margin-left: 0;
            }
        }

        @media (max-width: 690px) {
            .shell {
                width: min(100% - 28px, 1200px);
            }

            .nav-links {
                display: none;
            }

            .hero h1 {
                font-size: clamp(3.5rem, 18vw, 6rem);
            }

            .quick-facts,
            .skill-grid,
            .project-grid,
            .education-grid,
            .additional-grid,
            .credential-grid {
                grid-template-columns: 1fr;
            }

            .concept-note {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
                padding-block: 14px;
            }

            .section {
                padding-block: 72px;
            }

            .section-heading {
                grid-template-columns: 1fr;
                gap: 5px;
            }

            .role {
                grid-template-columns: 28px minmax(0, 1fr);
                gap: 10px;
                padding-left: 20px;
            }

            .role-meta,
            .role-content {
                grid-column: 2;
            }

            .project-body {
                padding-left: 52px;
            }

            .course-list li {
                grid-template-columns: 1fr;
                gap: 1px;
            }
        }

        @media print {
            .topbar,
            .concept-note,
            .hero-actions,
            .contact-section,
            .site-footer {
                display: none;
            }

            body,
            .site-header,
            .skill-group,
            .project,
            .education-card,
            .additional-grid article,
            .credential-card {
                background: #fff;
                color: #111;
            }

            .site-header {
                min-height: auto;
            }

            .hero,
            .section {
                padding-block: 24px;
            }
        }
    </style>
</head>
<body data-concept="4" data-concept-name="Technical">
    <div id="app"></div>
    <script src="resume-data.js"></script>
</body>
</html>
