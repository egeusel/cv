<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ege Usel - software engineer, full-stack developer, and data engineer.">
    <title>Ege Usel | Minimal Resume</title>
    <style>
        :root {
            --paper: #f7f7f4;
            --ink: #101010;
            --muted: #656565;
            --red: #e5432f;
            --line: #b9b9b4;
            --soft-line: #dbdbd6;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.55;
        }

        a {
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        :focus-visible {
            outline: 3px solid var(--red);
            outline-offset: 3px;
        }

        .shell {
            width: min(1320px, calc(100% - 48px));
            margin-inline: auto;
        }

        .skip-link {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 50;
            padding: 9px 12px;
            background: var(--ink);
            color: var(--paper);
            transform: translateY(-160%);
        }

        .skip-link:focus {
            transform: none;
        }

        .topbar {
            min-height: 70px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            border-bottom: 1px solid var(--ink);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .monogram {
            font-size: 1rem;
            font-weight: 900;
            text-decoration: none;
        }

        .monogram::after {
            content: ".";
            color: var(--red);
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a,
        .resume-link {
            text-decoration: none;
        }

        .nav-links a:hover,
        .resume-link:hover {
            color: var(--red);
        }

        .resume-link {
            justify-self: end;
        }

        .hero {
            min-height: 710px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 260px;
            gap: 70px;
            align-items: end;
            padding-block: 80px 54px;
        }

        .eyebrow {
            margin: 0 0 20px;
            color: var(--red);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .hero h1 {
            max-width: 1000px;
            margin: 0;
            font-size: clamp(5rem, 12vw, 11.5rem);
            font-weight: 800;
            letter-spacing: -0.095em;
            line-height: 0.74;
        }

        .hero-role {
            max-width: 820px;
            margin: 60px 0 18px;
            font-size: clamp(1.4rem, 2.8vw, 2.4rem);
            font-weight: 500;
            letter-spacing: -0.035em;
            line-height: 1.15;
        }

        .hero-bio {
            max-width: 760px;
            margin: 0;
            color: var(--muted);
            font-size: 0.86rem;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            margin-top: 28px;
        }

        .button {
            padding-bottom: 3px;
            border-bottom: 1px solid var(--ink);
            font-size: 0.72rem;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
        }

        .button:hover {
            color: var(--red);
            border-color: var(--red);
        }

        .quick-facts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            max-width: 760px;
            margin: 38px 0 0;
            border-top: 1px solid var(--ink);
        }

        .quick-facts div {
            padding: 12px 18px 0 0;
        }

        .quick-facts dt {
            color: var(--muted);
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .quick-facts dd {
            margin: 2px 0 0;
            font-size: 0.78rem;
            font-weight: 750;
        }

        .portrait {
            margin: 0;
        }

        .portrait-frame {
            overflow: hidden;
            border-radius: 50%;
        }

        .portrait img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            filter: grayscale(1) contrast(1.05);
        }

        .portrait figcaption {
            display: grid;
            gap: 2px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--ink);
            font-size: 0.68rem;
        }

        .portrait figcaption span {
            color: var(--muted);
        }

        .concept-note {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--ink);
            font-size: 0.64rem;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .concept-switcher {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .concept-switcher > span {
            color: var(--muted);
        }

        .concept-switcher a {
            text-decoration: none;
        }

        .concept-switcher a::after {
            content: "/";
            margin-left: 10px;
            color: var(--line);
        }

        .concept-switcher a:last-child::after {
            display: none;
        }

        .concept-switcher a[aria-current="page"] {
            color: var(--red);
        }

        .section {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            gap: clamp(40px, 8vw, 130px);
            padding-block: 100px;
            border-bottom: 1px solid var(--ink);
        }

        .section > :not(.section-heading) {
            grid-column: 2;
        }

        .section-heading {
            grid-row: 1 / span 3;
            align-self: start;
            position: sticky;
            top: 24px;
        }

        .section-number {
            display: block;
            margin-bottom: 12px;
            color: var(--red);
            font-size: 0.68rem;
            font-weight: 800;
        }

        .section-heading h2 {
            margin: 0;
            font-size: clamp(2.4rem, 4.5vw, 4rem);
            letter-spacing: -0.065em;
            line-height: 0.95;
        }

        .section-heading p {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .skill-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border-top: 1px solid var(--ink);
        }

        .skill-group {
            min-height: 180px;
            padding: 22px 26px 28px 0;
            border-bottom: 1px solid var(--soft-line);
        }

        .skill-group:nth-child(odd) {
            border-right: 1px solid var(--soft-line);
        }

        .skill-group:nth-child(even) {
            padding-left: 26px;
        }

        .skill-group h3 {
            margin: 0 0 16px;
            font-size: 0.82rem;
            text-transform: uppercase;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
        }

        .tag-list span {
            color: var(--muted);
            font-size: 0.74rem;
        }

        .tag-list span:not(:last-child)::after {
            content: " / ";
            margin-inline: 5px;
            color: var(--red);
        }

        .timeline {
            border-top: 1px solid var(--ink);
        }

        .role {
            display: grid;
            grid-template-columns: 36px 190px minmax(0, 1fr);
            gap: 22px;
            padding-block: 38px;
            border-bottom: 1px solid var(--soft-line);
        }

        .role-index,
        .project-index,
        .credential-index {
            color: var(--red);
            font-size: 0.64rem;
            font-weight: 800;
        }

        .role-meta p {
            margin: 0;
        }

        .role-company {
            font-size: 0.84rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .role-date {
            margin-top: 5px !important;
            color: var(--muted);
            font-size: 0.64rem;
            text-transform: uppercase;
        }

        .role-content h3 {
            margin: 0 0 17px;
            font-size: 1.2rem;
            letter-spacing: -0.025em;
        }

        .bullet-list {
            margin: 0;
            padding-left: 1rem;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .bullet-list li {
            margin-bottom: 9px;
            padding-left: 7px;
        }

        .bullet-list li::marker {
            color: var(--red);
        }

        .bullet-list strong {
            color: var(--ink);
        }

        code {
            padding: 1px 3px;
            background: #e9e9e5;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 0.92em;
        }

        .project-grid {
            border-top: 1px solid var(--ink);
        }

        .project {
            border-bottom: 1px solid var(--soft-line);
        }

        .project summary {
            min-height: 88px;
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr) 28px;
            gap: 16px;
            align-items: center;
            padding: 15px 0;
            cursor: pointer;
            list-style: none;
        }

        .project summary::-webkit-details-marker {
            display: none;
        }

        .project summary:hover .project-name {
            color: var(--red);
        }

        .project-name {
            display: block;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: -0.015em;
            text-transform: uppercase;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 6px;
        }

        .project-tags span {
            color: var(--muted);
            font-size: 0.62rem;
            text-transform: uppercase;
        }

        .expand-icon::before {
            content: "\2193";
            font-size: 1rem;
        }

        .project[open] .expand-icon::before {
            content: "\2191";
            color: var(--red);
        }

        .project-body {
            max-width: 830px;
            padding: 4px 40px 28px 56px;
        }

        .education-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 40px;
            border-top: 1px solid var(--ink);
        }

        .education-card {
            padding-top: 24px;
        }

        .education-image {
            display: none;
        }

        .education-content h3 {
            margin: 0 0 20px;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
        }

        .course-list,
        .additional-grid ul {
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 0.7rem;
        }

        .course-list li {
            display: grid;
            grid-template-columns: minmax(92px, 0.32fr) 1fr;
            gap: 12px;
            padding: 7px 0;
            border-top: 1px solid var(--soft-line);
        }

        .course-list span,
        .additional-grid li {
            color: var(--muted);
        }

        .additional-grid {
            display: grid;
            grid-template-columns: 0.8fr 1.4fr 0.8fr;
            gap: 30px;
            margin-top: 55px;
            padding-top: 24px;
            border-top: 1px solid var(--ink);
        }

        .additional-grid h3 {
            margin: 0 0 12px;
            font-size: 0.78rem;
            text-transform: uppercase;
        }

        .additional-grid li {
            margin-bottom: 6px;
        }

        .credential-grid {
            border-top: 1px solid var(--ink);
        }

        .credential-card {
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr) auto;
            gap: 16px;
            align-items: center;
            min-height: 82px;
            border-bottom: 1px solid var(--soft-line);
            text-decoration: none;
        }

        .credential-card:hover strong {
            color: var(--red);
        }

        .credential-card strong,
        .credential-card small {
            display: block;
        }

        .credential-card strong {
            font-size: 0.84rem;
            text-transform: uppercase;
        }

        .credential-card small {
            margin-top: 2px;
            color: var(--muted);
            font-size: 0.68rem;
        }

        .contact-section {
            padding-block: 120px;
            background: var(--red);
            color: var(--paper);
        }

        .contact-inner h2 {
            max-width: 1100px;
            margin: 0 0 32px;
            font-size: clamp(4rem, 10vw, 10rem);
            letter-spacing: -0.09em;
            line-height: 0.78;
        }

        .contact-inner .eyebrow {
            color: var(--ink);
        }

        .contact-inner > a {
            font-size: clamp(1rem, 2.8vw, 1.6rem);
            font-weight: 750;
            text-underline-offset: 7px;
        }

        .contact-links {
            display: flex;
            gap: 24px;
            margin-top: 36px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .site-footer {
            padding-block: 24px;
            background: var(--ink);
            color: var(--paper);
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .site-footer .shell {
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: minmax(0, 1fr) 180px;
                gap: 35px;
            }

            .section {
                grid-template-columns: 190px minmax(0, 1fr);
                gap: 45px;
            }
        }

        @media (max-width: 700px) {
            .shell {
                width: min(100% - 28px, 1320px);
            }

            .topbar {
                grid-template-columns: 1fr auto;
            }

            .nav-links {
                display: none;
            }

            .hero {
                min-height: auto;
                grid-template-columns: 1fr;
                padding-block: 58px 42px;
            }

            .hero h1 {
                font-size: clamp(4.2rem, 23vw, 7rem);
            }

            .portrait {
                width: 180px;
            }

            .concept-note {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
                padding-block: 14px;
            }

            .section {
                grid-template-columns: 1fr;
                gap: 38px;
                padding-block: 70px;
            }

            .section > :not(.section-heading) {
                grid-column: 1;
            }

            .section-heading {
                position: static;
                grid-row: auto;
            }

            .skill-grid,
            .education-grid,
            .additional-grid {
                grid-template-columns: 1fr;
            }

            .skill-group:nth-child(n) {
                padding: 22px 0;
                border-right: 0;
            }

            .role {
                grid-template-columns: 30px minmax(0, 1fr);
                gap: 10px;
            }

            .role-meta,
            .role-content {
                grid-column: 2;
            }

            .project-body {
                padding-left: 40px;
            }

            .course-list li {
                grid-template-columns: 1fr;
                gap: 1px;
            }

            .quick-facts {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .contact-links {
                flex-direction: column;
            }
        }

        @media print {
            .topbar,
            .concept-note,
            .hero-actions,
            .contact-section,
            .site-footer,
            .portrait {
                display: none;
            }

            body {
                background: #fff;
                font-size: 10pt;
            }

            .hero {
                min-height: auto;
                grid-template-columns: 1fr;
                padding-block: 20px;
            }

            .hero h1 {
                font-size: 54pt;
            }

            .section {
                grid-template-columns: 150px 1fr;
                gap: 30px;
                padding-block: 24px;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body data-concept="6" data-concept-name="Minimal">
    <div id="app"></div>
    <script src="resume-data.js"></script>
</body>
</html>
